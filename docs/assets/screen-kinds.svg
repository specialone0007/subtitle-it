<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
<title id="t">What a reader finds in the picture, and what becomes a subtitle</title><desc id="d">Four frames. Story text the film wants read is added when there is room: title cards and captions, such as THREE YEARS LATER subtitled ÜÇ YIL SONRA, with dedications and closing text; and signs, messages and letters, such as a text message Where are you? subtitled Neredesin?. What is not story text is never added: credits and logos, background text, and text the film does not want read.</desc>
