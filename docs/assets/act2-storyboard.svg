<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
<title id="t">Act 2 in four frames</title><desc id="d">Four film frames, one for each part of act 2. Step 3, speaker hints: a local model hears which voice speaks each line, such as voice 1 for the line You're late, Joe. It is optional and runs on your machine. Step 4, film bible: one agent reads the film once and writes the shared decisions, such as Mara says sen to Joe, Joe says siz to the Captain, and the watch is nöbet. Step 5, a second reader answers the same questions without seeing the bible. Step 5, a judge reads the cited cues where the two differ, and decides.</desc>
