<title id="t">What leaves your machine</title><desc id="d">Two rooms. The video, the audio and your credentials file stay on your machine: the audio models run there. Subtitle text and a capped number of still frames go to Claude, inside your own Claude Code session. Your film folder gets one new file, the subtitle. Subtitle searches and model downloads go to their own services, and the privacy page lists every one.</desc>
