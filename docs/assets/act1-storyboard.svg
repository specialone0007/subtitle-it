<title id="t">Act 1 in four frames</title><desc id="d">Four film frames, one for each part of act 1. Step 0, start: a script checks that uv and ffprobe are installed and reads your preferences. Step 1, find the film: it searches your media folders for the name you gave and finds Harbour Lights.mkv. Step 2, get subtitles: your disk first, then the subtitle site, then the film's own speech as the last resort. Step 2, build the work folder: sound tags such as [door slams] come out, and the film is cut into chunks of about 250 cues, each cut at the longest pause.</desc>
