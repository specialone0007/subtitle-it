<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="t d">
<title id="t">Where files go</title><desc id="d">Three sets of shelves. Next to the video: the film Harbour Lights.mkv and one new file, Harbour Lights.srt, and nothing else; it is never deleted by the plugin. Your settings folder, ~/.config/subtitle-it/: preferences.md, credentials.json and backups/; it is kept when the plugin is uninstalled. The plugin's data folder, ~/.claude/plugins/data/subtitle-it-.../: one work folder per film, the download cache and each script's last result; it is deleted when you uninstall the plugin.</desc>
