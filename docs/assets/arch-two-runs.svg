<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 530" width="1280" height="530" role="img" aria-labelledby="t d">
<title id="t">Two kinds of run</title><desc id="d">Two panels side by side. A translate run happens when no usable Turkish subtitle exists: it starts from the source subtitles, and the language work is translators, then reviewers, then listeners. A polish run happens when a human-made Turkish subtitle fits the video: it starts from the human file, placed on the timing file's cues, and the language work is one polish fixer with reviewers at the same time, then listeners.</desc>
