<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
<title id="t">From nothing to your first subtitle</title><desc id="d">A storyboard of four film frames. Install the plugin with two commands in your shell. Install uv, which runs the scripts, and ffmpeg, which reads the tracks inside videos. Type one command in a new Claude Code session, with a film's name or its path. When the run ends the subtitle, Harbour Lights.srt, sits next to the video under exactly the video's name. The first time you give a name, the plugin asks for the folder that holds your films.</desc>
