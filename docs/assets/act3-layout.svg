<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 690" width="1280" height="690" role="img" aria-labelledby="t d">
<title id="t">How a cue is laid out</title><desc id="d">Two cues from an invented film, before and after the layout script. First, a two-line cue that breaks badly: the second line starts with the word diye, which leans on the word before it, so the script moves the break. Second, a cue with two speakers whose first line runs past 42 characters: the script splits it at the speaker change into one cue per speaker, and each part gets its share of the time, 1 second at least. A cue that reads too fast stays on screen a little longer, half a second at most.</desc>
