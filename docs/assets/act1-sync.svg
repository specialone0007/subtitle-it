<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 482" width="1280" height="482" role="img" aria-labelledby="t d">
<title id="t">The timing file against the speech</title><desc id="d">Three lines of an invented film on a timeline: You came back. I said I would. Cast off. The top track is the speech as a local model hears it. Before, every subtitle cue starts a little late. After, one shift has moved every cue under its words. How: a local model transcribes 6 stretches of the film, 3 minutes each. A script looks for each cue's first 3 words near where the cue starts. When the cues are off by more than 300 ms, and by a steady amount through the film, every cue moves.</desc>
