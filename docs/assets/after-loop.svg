<rect x="41" y="224" width="283" height="45" fill="#0c0c10" opacity="0.85"/>
<text x="182.5" y="254" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f4efe1">Peki, gidelim.</text>
