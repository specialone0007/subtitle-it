<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
<title id="t">Your fixes become rules</title><desc id="d">A strip of four film frames. Watch the film: a line reads Peki, gidelim. Fix the line in the .srt with any editor: Peki becomes Tamam. Run the learn command: it says you changed Peki to Tamam in 6 places and asks whether to always use Tamam for OK, and you say yes or no. The rule is saved under Learned rules in your preferences, and the next film follows it. Each new translate run reminds you, in one line, of delivered files you have edited.</desc>
