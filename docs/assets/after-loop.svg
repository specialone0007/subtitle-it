<path d="M329 176.0 l14 9 l-14 9 z" fill="#8a8578"/>
<text x="42" y="308" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4efe1">Watch the film</text>
<text x="42" y="334" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">Nothing in the chat spoils it.</text>
<rect x="350" y="100" width="285" height="170" rx="6" fill="url(#sky)" stroke="#2a2a31"/>
<circle cx="434" cy="162" r="20" fill="#22222b"/>
<path d="M392 224 q42 -68 84 0 z" fill="#22222b"/>
<rect x="501.32" y="127" width="97.36" height="26" rx="13.0" fill="#0b0b0d" stroke="#c9a227" stroke-width="1.2"/>
<text x="550" y="146" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c9a227">your fix</text>
<rect x="351" y="224" width="283" height="45" fill="#0c0c10" opacity="0.85"/>
<text x="390" y="254" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e7b3b0">Peki,</text>
<line x1="386" y1="247" x2="442" y2="247" stroke="#d9534f" stroke-width="2"/>
<text x="452" y="254" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f4efe1">Tamam, gidelim.</text>
<rect x="350" y="100" width="285" height="6" rx="3" fill="#c9a227"/>
<line x1="629" y1="185.0" x2="641" y2="185.0" stroke="#8a8578" stroke-width="2.5"/>
<path d="M639 176.0 l14 9 l-14 9 z" fill="#8a8578"/>
<text x="352" y="308" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4efe1">Fix a line</text>
<text x="352" y="334" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">Open the .srt in any editor.</text>
<rect x="660" y="100" width="285" height="170" rx="6" fill="url(#sky)" stroke="#2a2a31"/>
<rect x="674" y="126" width="242" height="74" rx="14" fill="#1f1f27" stroke="#2a2a31" stroke-width="1"/>
<path d="M704 199 l-10 16 l26 -16 z" fill="#1f1f27"/>
<text x="795" y="156" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f4efe1">‘Peki’ → ‘Tamam’ in 6 places.</text>
<text x="795" y="182" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#cfc8b4">Always ‘Tamam’ for ‘OK’?</text>
<rect x="786.12" y="223" width="47.76" height="26" rx="13.0" fill="#0b0b0d" stroke="#c9a227" stroke-width="1.2"/>
<text x="810" y="242" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c9a227">yes</text>
<rect x="853.08" y="223" width="37.84" height="26" rx="13.0" fill="#0b0b0d" stroke="#8a8578" stroke-width="1.2"/>
<text x="872" y="242" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8a8578">no</text>
<rect x="660" y="100" width="285" height="6" rx="3" fill="#c9a227"/>
<line x1="939" y1="185.0" x2="951" y2="185.0" stroke="#8a8578" stroke-width="2.5"/>
<path d="M949 176.0 l14 9 l-14 9 z" fill="#8a8578"/>
<text x="662" y="308" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4efe1">Run the learn command</text>
<text x="662" y="334" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">It proposes at most five rules.</text>
<text x="662" y="357" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">You say yes or no to each.</text>
<rect x="970" y="100" width="285" height="170" rx="6" fill="url(#sky)" stroke="#2a2a31"/>
<rect x="984" y="126" width="242" height="70" rx="8" fill="#1f1f27" stroke="#2a2a31" stroke-width="1"/>
<text x="1000" y="152" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#c9a227">LEARNED RULES</text>
<text x="1000" y="180" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#f4efe1">Always ‘Tamam’ for ‘OK’</text>
<rect x="971" y="224" width="283" height="45" fill="#0c0c10" opacity="0.85"/>
<text x="1112.5" y="254" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f4efe1">Tamam, anlaştık.</text>
<rect x="970" y="100" width="285" height="6" rx="3" fill="#c9a227"/>
<text x="972" y="308" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4efe1">The next film follows it</text>
<text x="972" y="334" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">Saved under Learned rules</text>
<text x="972" y="357" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">in your preferences.</text>
<text x="640.0" y="402" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-style="italic" fill="#8a8578">You do not have to remember: each new translate run reminds you, in one line.</text>
</svg>
