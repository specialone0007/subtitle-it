<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 562" width="1280" height="562" role="img" aria-labelledby="t d">
<title id="t">The blind check of the bible</title><desc id="d">Two answer sheets for an invented film, side by side. The bible writer and the second reader, who never sees the bible, answer the same four questions. Mara to Joe: both say sen. Joe to the Captain: both say siz. The watch: both say nöbet. Those three are locked by a script. Mara to her mother: the writer says sen and the second reader says siz, so the question goes to the judge, who reads the cited cues and decides sen.</desc>
