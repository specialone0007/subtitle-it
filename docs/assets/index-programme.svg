<title id="t">The docs programme</title><desc id="d">A cinema programme board with one row for each shelf of the docs. Getting started: Setup, with what you need, the install, your first run and what to do when a step fails. Guides: After a run, to read the report, fix lines and teach the plugin your fixes. Reference: How a run works, the acts on one page each, On-screen text, Checks, Preferences, Files and privacy, and Numbers. Explanation: the ideas behind it. History: the changelog.</desc>
