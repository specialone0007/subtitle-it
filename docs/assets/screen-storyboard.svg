<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-labelledby="t d">
<title id="t">How a sign in the picture becomes a subtitle</title><desc id="d">A storyboard of four frames. One: in the film's other subtitle tracks, a few show a line the timing file lacks; that is too few languages, so the text is unsure. Two: a script saves still frames of the opening, the ending and each unsure text, 5 frames across its time. Three: a screen reader agent writes down the text, CLOSED, its kind, a sign, and whether the film wants it read. Four: a story reading names the row, so it becomes a cue of its own, and the sign is subtitled KAPALI.</desc>
