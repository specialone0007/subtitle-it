<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
<title id="t">What the check looks at on every cue</title><desc id="d">One film frame with a two-line Turkish cue, and what the script assemble.py check looks at. Hard fails go back to the translator: every cue is there, with none missing, extra or empty; italics and dialogue dashes are the same as the source; nothing is left over, so no slash and, by default, no square brackets and no speaker label; the cue fits two lines of 42 characters. Warnings go to the reviewers: a reading speed above 17 characters a second; spelling, such as sağol for sağ ol; terms and repeated lines written one way all film long; and the bible's sen or siz for each pair.</desc>
