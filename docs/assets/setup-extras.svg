<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
<title id="t">The three extras</title><desc id="d">Three optional extras, shown as bonus features. OpenSubtitles finds subtitles you do not have on disk: it needs a free account and API key, and allows 5 downloads a day, or 20 with a login. Audio hints say which voice speaks each line: they need a free Hugging Face token, and the first run downloads a few GB. Speech-to-text is the last resort when no subtitle exists anywhere: it needs no setup and no token, and downloads a model of about 1.6 GB. When a film needs one, the plugin prints its setup command.</desc>
