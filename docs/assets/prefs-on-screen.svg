<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
<title id="t">Three settings, as you see them on screen</title><desc id="d">Four film frames. Hearing-impaired tags, set to remove: the sound description [door slams] and the speaker label MARA: go, and the line reads İçeri gel. Titles, set to Bay/Bayan + surname: Buyurun, Bayan Kaya; the other choice gives Ayşe Hanım. Credit, on: the file opens with İyi seyirler. and closes with Görüşmek üzere., each over your name, here the invented Mira Lund. Tags and titles are shown at their defaults, and the credit shows a name only when you add one.</desc>
