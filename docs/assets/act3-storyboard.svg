<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 510" width="1280" height="510" role="img" aria-labelledby="t d">
<title id="t">Act 3, step by step</title><desc id="d">Four film frames for steps 6 to 9 of a run, with an invented film. Songs first: by default only the songs that carry the story are translated. The translators: one per chunk, all started at once, each with the film bible. Assemble and check: a script joins the chunks and checks every cue, and a hard fail goes back to its translator. Fix rounds: rounds 1 and 2 go to the chunk's own translator, round 3 to a stronger model. In a polish run there are no translators: one fixer changes only the flagged cues of a human-made Turkish subtitle.</desc>
