<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 596" width="1280" height="596" role="img" aria-labelledby="t d">
<title id="t">Where the time goes</title><desc id="d">A strip of film for each stretch of a run, one frame for each median minute. Steps 0 to 2, find the film and its subtitles: 7 minutes. Steps 3 to 5, audio hints, the film bible and its check: 11 minutes. Steps 6 to 7, translate from scratch: 4 minutes, or polish a human subtitle: 11 minutes. Steps 8 to 9, assemble and check: under a minute. Step 10, review against the source: about a minute. Step 11, listen pass: 3 minutes. Step 12, deliver and write the report: under a minute. These are stretches of the clock, not the agents' own work.</desc>
