<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" width="1280" height="570" role="img" aria-labelledby="t d">
<title id="t">The call sheet: every setting at its default</title><desc id="d">A settings card for preferences.md, read at the start of every run. Media folders: asked on the first run. Translator model: session, the model of your conversation. Audio hints: auto, which runs them when an NVIDIA GPU is found. Hearing-impaired tags: remove. Songs: story, only the songs that carry the story. Swearing: match the source. Titles: Bay/Bayan + surname, as in Bayan Kaya. Credit: on. Learned rules: empty until learn mode adds them, after your yes.</desc>
