<text x="76" y="102" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#c9a227">CALL SHEET  ·  EVERY SETTING AT ITS DEFAULT</text>
<text x="76" y="150" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="38" fill="#f4efe1">preferences.md</text>
<text x="1204" y="150" text-anchor="end" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-style="italic" fill="#8a8578">read at the start of every run</text>
<line x1="76" y1="174" x2="1204" y2="174" stroke="#2a2a31" stroke-width="1"/>
<text x="76" y="218" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c9a227">MEDIA FOLDERS</text>
<text x="76" y="252" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="23" font-style="italic" fill="#cfc8b4">asked on the first run</text>
<text x="76" y="280" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">Where a film is searched by name.</text>
<text x="468" y="218" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c9a227">TRANSLATOR MODEL</text>
<text x="468" y="252" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="23" fill="#f4efe1">session</text>
<text x="468" y="280" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">The model of your conversation.</text>
<text x="860" y="218" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c9a227">AUDIO HINTS</text>
<text x="860" y="252" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="23" fill="#f4efe1">auto</text>
<text x="860" y="280" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">Runs when an NVIDIA GPU is found.</text>
<text x="76" y="324" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c9a227">HEARING-IMPAIRED TAGS</text>
<text x="76" y="358" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="23" fill="#f4efe1">remove</text>
<text x="76" y="386" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">Sound descriptions and labels go.</text>
<text x="468" y="324" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c9a227">SONGS</text>
<text x="468" y="358" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="23" fill="#f4efe1">story</text>
<text x="468" y="386" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">Only the songs that carry the story.</text>
<text x="860" y="324" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c9a227">SWEARING</text>
<text x="860" y="358" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="23" fill="#f4efe1">match the source</text>
<text x="860" y="386" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">As strong in Turkish as in the source.</text>
<text x="76" y="430" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c9a227">TITLES</text>
<text x="76" y="464" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="23" fill="#f4efe1">Bay/Bayan + surname</text>
<text x="76" y="492" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">“Bayan Kaya”, not “Ayşe Hanım”.</text>
<text x="468" y="430" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c9a227">CREDIT</text>
<text x="468" y="464" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="23" fill="#f4efe1">on</text>
<text x="468" y="492" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">Two credit lines, with your name if set.</text>
<text x="860" y="430" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#c9a227">LEARNED RULES</text>
<text x="860" y="464" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="23" font-style="italic" fill="#cfc8b4">empty</text>
<text x="860" y="492" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cfc8b4">Learn mode adds them, after your yes.</text>
