<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="t d">
<title id="t">A sample of Check after watching</title><desc id="d">The last section of report.md, for an invented film, Harbour Lights. It lists what the run could not settle for certain, each with a timestamp. Five sample items: a decision settled by a safe default (does Joe say sen or siz to the Captain; it chose siz), in a polish run a crude line that stayed softer than the English, a cue that still fails a check after the fix rounds, a translator's flag the reviewers left open, and the goodbye's time, because the picture showed no end cards.</desc>
