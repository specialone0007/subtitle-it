<text x="76" y="102" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#c9a227">REPORT.MD  ·  THE LAST SECTION</text>
<text x="1204" y="150" text-anchor="end" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-style="italic" fill="#8a8578">Harbour Lights, an invented film</text>
<text x="76" y="150" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="40" fill="#f4efe1">Check after watching</text>
<text x="76" y="184" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#cfc8b4">What the run could not settle for certain, each with a timestamp.</text>
<line x1="76" y1="206" x2="1204" y2="206" stroke="#2a2a31" stroke-width="1"/>
<text x="76" y="246" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="20" fill="#8a8578">00:18:42</text>
<text x="212" y="245" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2.5" fill="#c9a227">A SAFE DEFAULT</text>
<text x="530" y="246" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#f4efe1">Does Joe say sen or siz to the Captain? It chose siz.</text>
<line x1="76" y1="262" x2="1204" y2="262" stroke="#2a2a31" stroke-width="1"/>
<text x="76" y="290" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="20" fill="#8a8578">00:47:15</text>
<text x="212" y="289" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2.5" fill="#c9a227">POLISH RUN: SOFTER</text>
<text x="530" y="290" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#f4efe1">“Lanet olsun!” stands for a much cruder English line.</text>
<line x1="76" y1="306" x2="1204" y2="306" stroke="#2a2a31" stroke-width="1"/>
<text x="76" y="334" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="20" fill="#8a8578">01:12:04</text>
<text x="212" y="333" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2.5" fill="#c9a227">STILL FAILS A CHECK</text>
<text x="530" y="334" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#f4efe1">Cue 412: the italics still differ from the source.</text>
<line x1="76" y1="350" x2="1204" y2="350" stroke="#2a2a31" stroke-width="1"/>
<text x="76" y="378" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="20" fill="#8a8578">01:31:50</text>
<text x="212" y="377" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2.5" fill="#c9a227">A TRANSLATOR'S FLAG</text>
<text x="530" y="378" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#f4efe1">A pun on “harbour”. The joke may not land in Turkish.</text>
<line x1="76" y1="394" x2="1204" y2="394" stroke="#2a2a31" stroke-width="1"/>
<text x="76" y="422" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="20" fill="#8a8578">01:58:33</text>
<text x="212" y="421" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="2.5" fill="#c9a227">THE GOODBYE'S TIME</text>
<text x="530" y="422" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#f4efe1">The picture showed no end cards. See that it lands well.</text>
<text x="640.0" y="464" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-style="italic" fill="#8a8578">Open it after the film, since it quotes lines.</text>
</svg>
