<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 516" width="1280" height="516" role="img" aria-labelledby="t d">
<title id="t">On the cutting-room floor</title><desc id="d">Three cut pieces of film, one for each thing that was tried and turned down. Translators at low reasoning effort: cheaper, and tied a blind test on meaning, but a second review found lines a Turkish speaker would not say, so the translators went back to medium. Renumbering the cues after a timing shift: it would break every cue number the film bible cites. Reading the picture after the sync check: it would move a step of the run after the bible, which already cites cue numbers.</desc>
