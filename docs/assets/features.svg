<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 716" width="1280" height="716" role="img" aria-labelledby="t d">
<title id="t">What you get</title><desc id="d">Eight film frames, one for each thing the plugin gives you. Natural Turkish, by meaning and never word for word. One voice: a film bible fixes names, terms and who says sen or siz. Cue for cue with the source, in two short lines, with nothing merged. Signs and title cards on screen are subtitled too. No questions and no spoilers. An honest report of what it could not settle, with timestamps. It learns from the lines you fix, when you run the learn command. The video and the audio never leave your machine.</desc>
