<text x="468" y="340" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8a8578">the watch</text>
<text x="636" y="340" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#f4efe1">nöbet</text>
<text x="468" y="382" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8a8578">harbour master</text>
<text x="636" y="382" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#f4efe1">liman başkanı</text>
<text x="860" y="298" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#cfc8b4">A second reader answers the</text>
