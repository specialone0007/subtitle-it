<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d">
<title id="t">The film bible</title><desc id="d">A page of a film bible for an invented film, Harbour Lights. It is written once, before a line is translated. It fixes who says sen or siz to whom: Mara says sen to Joe, Joe says siz to the Captain, Mara says sen to her mother. It fixes one Turkish word for each term: Deputy is Şerif Yardımcısı, the watch is nöbet, harbour master is liman başkanı. A second reader answers the same questions without seeing the answers, and a judge settles the rest.</desc>
