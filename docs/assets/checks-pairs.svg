<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" width="1280" height="710" role="img" aria-labelledby="t d">
<title id="t">A hard fail and a warning, before and after</title><desc id="d">Four pairs of film frames with invented cues. Hard fails go back to the translator. Square brackets: the cue [kapı çalar] Kim o? fails, and Kim o? passes. Line-join slash: - Geliyor musun? / - Evet. on one line fails, and the same two speakers on two lines pass. Warnings go to the reviewers. Spelling: Sağol, Kaptan. gets a warning, and Sağ ol, Kaptan. does not. Sen or siz: Sen bilirsin, Kaptan. gets a warning because the bible gives siz for that pair, and Siz bilirsiniz, Kaptan. does not.</desc>
