<text x="640.0" y="70" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="8" fill="#c9a227">THE CAST</text>
<rect x="40" y="96" width="376" height="264" rx="6" fill="#141418" stroke="#2a2a31"/>
<rect x="40" y="96" width="376" height="6" rx="3" fill="#4a90d9"/>
<text x="68" y="152" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" fill="#f4efe1">The scripts</text>
<text x="68" y="180" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-style="italic" fill="#4a90d9">as the crew</text>
<line x1="68" y1="200" x2="388" y2="200" stroke="#2a2a31"/>
<text x="68" y="232" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cfc8b4">Plain Python, no model.</text>
<circle cx="73" cy="263" r="2.5" fill="#4a90d9"/>
<text x="86" y="268" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8a8578">Read subtitle files and match timings.</text>
<circle cx="73" cy="289" r="2.5" fill="#4a90d9"/>
<text x="86" y="294" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8a8578">Cut the film into chunks.</text>
<circle cx="73" cy="315" r="2.5" fill="#4a90d9"/>
<text x="86" y="320" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8a8578">Check every cue, then write the .srt.</text>
<rect x="452" y="96" width="376" height="264" rx="6" fill="#141418" stroke="#2a2a31"/>
<rect x="452" y="96" width="376" height="6" rx="3" fill="#3fb27f"/>
<text x="480" y="152" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" fill="#f4efe1">The local models</text>
<text x="480" y="180" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-style="italic" fill="#3fb27f">as the sound department</text>
<line x1="480" y1="200" x2="800" y2="200" stroke="#2a2a31"/>
<text x="480" y="232" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cfc8b4">pyannote and Whisper, on your machine.</text>
<circle cx="485" cy="263" r="2.5" fill="#3fb27f"/>
<text x="498" y="268" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8a8578">Hear which voice speaks each line.</text>
<circle cx="485" cy="289" r="2.5" fill="#3fb27f"/>
<text x="498" y="294" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8a8578">Check the subtitles are in sync.</text>
<circle cx="485" cy="315" r="2.5" fill="#3fb27f"/>
<text x="498" y="320" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8a8578">Write subtitles from speech if none exist.</text>
<rect x="864" y="96" width="376" height="264" rx="6" fill="#141418" stroke="#2a2a31"/>
<rect x="864" y="96" width="376" height="6" rx="3" fill="#d9534f"/>
<text x="892" y="152" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" fill="#f4efe1">Claude</text>
<text x="892" y="180" text-anchor="start" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-style="italic" fill="#d9534f">as the writers' room</text>
<line x1="892" y1="200" x2="1212" y2="200" stroke="#2a2a31"/>
<text x="892" y="232" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cfc8b4">Seven kinds of agent.</text>
<circle cx="897" cy="263" r="2.5" fill="#d9534f"/>
<text x="910" y="268" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8a8578">Bible writer, second reader and judge.</text>
<circle cx="897" cy="289" r="2.5" fill="#d9534f"/>
<text x="910" y="294" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8a8578">Voice mapper and parallel translators.</text>
<circle cx="897" cy="315" r="2.5" fill="#d9534f"/>
<text x="910" y="320" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8a8578">Polish fixer and whole-film reviewer.</text>
</svg>
