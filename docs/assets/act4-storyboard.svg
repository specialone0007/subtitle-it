<title id="t">Act 4, step by step</title><desc id="d">Three film frames for steps 10 to 12 of a run, with an invented film. Review: a reviewer reads every Turkish line next to its source and finds a line where the name is missing; a line that passes stays as it is. Listen: a listener reads the Turkish alone, as a viewer does, and rewrites a line that sounds translated; a script drops any edit that breaks a check. Deliver: Harbour Lights.srt is written next to Harbour Lights.mkv, and report.md in the work folder lists what to check after watching.</desc>
