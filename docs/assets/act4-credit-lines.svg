<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 496" width="1280" height="496" role="img" aria-labelledby="t d">
<title id="t">The two credit lines</title><desc id="d">The start and the end of an invented film as a strip of frames. The opening line, İyi seyirler, sits in the silence before the first line. After the last translated line, Fener hâlâ yanıyor, the picture cuts to black, and the goodbye, Görüşmek üzere, starts on that black, just before the end cards, and lasts 4 seconds. The end cards are credits, a title card, closing text or a logo. With no black stretch the goodbye starts on the first end card, and with no end cards 3 seconds after the last line.</desc>
