name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Tests
        run: uv run --group dev pytest -q
      - name: Lint
        run: uv run --group dev ruff check .
      - name: Format
        run: uv run --group dev ruff format --check .

  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Manifests are valid JSON with matching names and versions
        run: |
          python3 - <<'PY'
          import json, re, tomllib
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          names = [p["name"] for p in market["plugins"]]
          assert plugin["name"] in names, f"{plugin['name']} is not listed in marketplace.json"
          version = plugin["version"]
          found = {"pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]}
          found |= {f"marketplace.json ({p['name']})": p["version"] for p in market["plugins"] if "version" in p}
          agent = re.search(r'USER_AGENT = "TurkishSubtitles v([^"]+)"', open("scripts/opensubtitles.py").read())
          found["opensubtitles.py user agent"] = agent and agent.group(1)
          heading = re.search(r"^## (\S+)", open("CHANGELOG.md").read(), re.M)
          found["CHANGELOG.md first heading"] = heading and heading.group(1)
          wrong = {k: v for k, v in found.items() if v != version}
          assert not wrong, f"plugin.json says {version}, but: {wrong}"
          print("ok:", plugin["name"], version)
          PY
