# Development only. The plugin's scripts declare their own dependencies at
# the top of each file and run with `uv run scripts/<name>.py`.
[project]
name = "subtitle-it-dev"
version = "0.7.1"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "charset-normalizer>=3.3", "numpy>=1.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B905: the zips over cue lists are meant to stop at the shorter list.
ignore = ["E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["result", "srt", "prepare", "assemble", "learn", "sources", "opensubtitles", "speakers", "bible", "transcribe", "polish", "layout", "settings", "turkish", "compare", "usage"]
